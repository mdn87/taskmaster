# Keep the collector on the same selected release as taskmaster-watch.
[Service]
Environment=PYTHONPATH=/srv/lugos/services/taskmaster/current/src
WorkingDirectory=/srv/lugos/services/taskmaster/current
ExecStart=
ExecStart=/srv/lugos/services/taskmaster/current/.venv/bin/python -m taskmaster.remote_context collect --config /srv/lugos/state/taskmaster/context-migration/collector.json
