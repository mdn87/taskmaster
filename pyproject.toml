[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskmaster"
version = "0.1.0"
description = "Read-only objective trail index over owner records"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
taskmaster = "taskmaster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
